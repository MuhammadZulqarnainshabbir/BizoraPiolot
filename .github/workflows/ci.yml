# Continuous integration: runs on every pull request, and is reused by cd.yml before anything is published.
name: CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  backend:
    name: API tests + Postman collection
    runs-on: ubuntu-latest
    # The suite hashes many passwords (bcrypt, 12 rounds) and takes about 15 minutes on its own.
    timeout-minutes: 30
    env:
      # Sales use transactions, so even CI needs a replica set.
      TEST_MONGO_URI: mongodb://127.0.0.1:27017/bizora_pilot_test?directConnection=true
      MONGO_URI: mongodb://127.0.0.1:27017/bizora_pilot_postman?directConnection=true
      JWT_SECRET: ci-only-secret-that-is-long-enough-for-hs256-signing
      CLIENT_ORIGIN: http://localhost:4200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Start MongoDB (replica set)
        uses: supercharge/mongodb-github-action@1.12.0
        with:
          mongodb-version: '8.0'
          mongodb-replica-set: rs0
      - name: Install
        working-directory: backend
        run: npm ci
      - name: Unit and integration tests
        working-directory: backend
        run: npm test
      - name: Start API for the Postman collection
        working-directory: backend
        env:
          PORT: 3000
          NODE_ENV: test
        run: |
          node src/server.js > api.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://localhost:3000/api/health && break; sleep 1; done
          curl -fs http://localhost:3000/api/health
      - name: Run the Postman collection
        working-directory: backend
        run: npx --yes newman@6 run postman/bizora-pilot.postman_collection.json --env-var baseUrl=http://localhost:3000/api/v1 --reporters cli --bail
      - name: API log
        if: failure()
        working-directory: backend
        run: cat api.log || true

  frontend:
    name: "Web app: translations, unit tests, build"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Urdu translation is complete
        working-directory: frontend
        run: npm run i18n:check
      - name: Unit tests (Karma, headless Chrome)
        working-directory: frontend
        run: npm test
      - name: Production build
        working-directory: frontend
        run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: frontend/dist/electrohub-web/browser
          retention-days: 7

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend, frontend]
    env:
      E2E_MONGO_URI: mongodb://127.0.0.1:27017/bizora_pilot_e2e?directConnection=true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Start MongoDB (replica set)
        uses: supercharge/mongodb-github-action@1.12.0
        with:
          mongodb-version: '8.0'
          mongodb-replica-set: rs0
      - name: Install API
        working-directory: backend
        run: npm ci
      - name: Install web app
        working-directory: frontend
        run: npm ci
      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run end-to-end tests
        working-directory: frontend
        run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
