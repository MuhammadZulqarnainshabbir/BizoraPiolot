# Runs the whole stack: MongoDB (single-node replica set, required for transactions), the API and the web app.
#   cp .env.example .env   # set JWT_SECRET
#   docker compose up --build
# Then open http://localhost:8080
services:
  mongo:
    image: mongo:8.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      # Initiates the replica set the first time; afterwards just reports that it is healthy.
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }).ok }"]
      interval: 5s
      timeout: 10s
      retries: 24
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend
    image: bizora-pilot-backend
    environment:
      PORT: "3000"
      MONGO_URI: mongodb://mongo:27017/bizora_pilot?replicaSet=rs0
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (32+ characters)}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:8080}
      TRUST_PROXY: "1"
      OWNER_IDLE_MINUTES: ${OWNER_IDLE_MINUTES:-30}
      OWNER_MAX_HOURS: ${OWNER_MAX_HOURS:-12}
      EMPLOYEE_IDLE_MINUTES: ${EMPLOYEE_IDLE_MINUTES:-15}
      EMPLOYEE_MAX_HOURS: ${EMPLOYEE_MAX_HOURS:-12}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: bizora-pilot-frontend
    environment:
      API_UPSTREAM: http://backend:3000
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongo-data:
